# Push a v* tag and this builds the four release assets on a Windows runner
# and publishes the GitHub Release — the same set every release has carried:
#   RJC-TV-Control.exe        (x64 portable)
#   RJC-TV-Control-arm64.exe  (arm64 portable)
#   RJC-TV-Control-x64.zip    (unpacked app — Defender-friendly)
#   RJC-TV-Control-arm64.zip
name: Release

# Two ways to cut a release: push a v* tag, or run this workflow manually
# (Actions → Release → Run workflow) — the manual path tags the current
# commit with v<package.json version> for you.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build x64 (portable exe + zip)
        shell: bash
        run: npx electron-builder --win portable zip --x64 --publish never "-c.win.artifactName=RJC-TV-Control-x64.zip"

      - name: Build arm64 (portable exe + zip)
        shell: bash
        run: npx electron-builder --win portable zip --arm64 --publish never "-c.win.artifactName=RJC-TV-Control-arm64.zip" "-c.portable.artifactName=RJC-TV-Control-arm64.exe"

      - name: Tag and release title
        id: meta
        shell: bash
        # Tag from the pushed ref, or v<version> on a manual run; the release
        # is titled after the version's commit subject, trimmed at the em-dash.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          SUBJECT=$(git log -300 --pretty=%s | grep -F -m1 "$TAG:" || true)
          SUBJECT="${SUBJECT:-$TAG}"
          SUBJECT="${SUBJECT%% — *}"
          { echo "tag=$TAG"; echo "subject=$SUBJECT"; } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.subject }}
          body: 'ZIP recommended; unzip into C:\RJC-TV.'
          generate_release_notes: true
          files: |
            release/RJC-TV-Control.exe
            release/RJC-TV-Control-arm64.exe
            release/RJC-TV-Control-x64.zip
            release/RJC-TV-Control-arm64.zip
